# bundle patch for the skills-hub plugin: inserts its plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile desktop add link:E:\Code\DSH-SkillsHub`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (the /api/skills-hub route family), and the dsh.client
# declaration in package.json makes the browser half (exports "./client",
# served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: skills-hub
      name: '@wulongxi/dsh-skills-hub'
